[project]
name = "mandrakemodels"
version = "0.1.0"
description = "Gridded-cell physics models: water, waves, diffusion, smoke, lattice Boltzmann"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pillow>=10", "matplotlib>=3.8"]

[project.optional-dependencies]
fast = ["numba>=0.59"]
# open-source cross-checks (MIT); see external.py. Not core.
crosscheck = ["landlab>=2.9", "phiflow>=3.0", "anuga>=4.1", "mpich>=4"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mandrakemodels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
